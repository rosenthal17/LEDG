<!DOCTYPE html>
<html lang="en" data-accent="gold" data-font="system">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledg">
<meta name="theme-color" content="#111214">
<title>Ledg</title>
<style>
  :root{
    --bg:#111214; --surface:#1B1C1F; --surface2:#242529; --surface3:#2C2D32;
    --text:#F2F1EE; --text-secondary:#8B8D93; --text-muted:#5C5D62;
    --border:#2A2B2F; --danger:#E2666B; --danger-bg:#3A2124;
    --accent:#D6A756; --accent-text:#1A1508;
    --font-app: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --radius:14px;
  }
  html{ --accent:#D6A756; --accent-text:#1A1508; }
  html[data-font="system"]{ --font-app: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html[data-font="helvetica"]{ --font-app: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  html[data-font="verdana"]{ --font-app: Verdana, Geneva, sans-serif; }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-app); overscroll-behavior:none; }
  body{ padding-bottom:calc(70px + env(safe-area-inset-bottom)); min-height:100vh; min-height:100dvh; }
  button, input, select, textarea{ font-family:inherit; }
  input, select, textarea{
    width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:10px 12px; font-size:16px; outline:none;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  button{ cursor:pointer; border:none; background:none; color:inherit; }
  .btn{ width:100%; border-radius:12px; padding:13px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; display:flex; align-items:center; justify-content:center; gap:6px; }
  .btn-primary{ background:var(--accent); color:var(--accent-text); }
  .btn-secondary{ background:var(--surface2); color:var(--text); }
  .btn-ghost{ background:transparent; color:var(--text-secondary); border:1px dashed var(--border); }
  .btn-danger{ background:var(--danger-bg); color:var(--danger); }
  .eyebrow{ color:var(--text-secondary); font-size:11px; text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px; font-weight:600; }
  .card{ background:var(--surface); border-radius:16px; padding:16px; margin-bottom:12px; }
  .row{ display:flex; align-items:center; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; }
  .divider{ border-top:1px solid var(--border); }
  #app-title{ text-align:center; padding:14px 0 0; font-size:15px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--text); }
  .screen{ max-width:480px; margin:0 auto; padding:16px 16px 8px; }
  .header{ display:grid; grid-template-columns:28px 1fr 28px; align-items:center; margin-bottom:4px; min-height:28px; }
  .header-title{ text-align:center; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.6px; }
  .header-icon{ font-size:18px; color:var(--text-secondary); }
  .header-icon.right{ justify-self:end; }
  .header-icon.disabled{ color:var(--text-muted); pointer-events:none; }
  .sub-date{ text-align:center; color:var(--text-secondary); font-size:12px; margin-bottom:16px; }
  .stat-grid{ display:grid; gap:8px; }
  .stat-box{ background:var(--surface2); border-radius:12px; padding:11px 12px; cursor:default; }
  .stat-box .val{ font-size:20px; font-weight:800; letter-spacing:-0.3px; }
  .stat-box .lbl{ color:var(--text-secondary); font-size:10px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:2px; }
  .list-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .list-row:last-child{ border-bottom:none; }
  .avatar{ width:32px; height:32px; border-radius:50%; background:var(--surface3); display:flex; align-items:center; justify-content:center; color:var(--accent); font-size:12px; font-weight:700; flex-shrink:0; }
  .name{ font-size:14px; }
  .meta{ color:var(--text-secondary); font-size:11px; margin-top:1px; }
  .amount{ font-size:14px; font-weight:700; white-space:nowrap; }
  .bottom-nav{ position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--border);
    display:flex; justify-content:space-around; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); z-index:20; }
  .nav-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-muted); font-size:8.5px; text-transform:uppercase; letter-spacing:0.3px; padding:4px 4px; flex:1; }
  .nav-btn.active{ color:var(--accent); }
  .nav-btn i{ font-size:20px; }

<script>
(function(){
"use strict";

/* ---------- IndexedDB layer ---------- */
const DB_NAME = "ink_ledger";
const DB_VERSION = 1;
let dbPromise = null;

function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains("customers")) db.createObjectStore("customers", {keyPath:"id"});
      if(!db.objectStoreNames.contains("entries")) db.createObjectStore("entries", {keyPath:"id"});
      if(!db.objectStoreNames.contains("deposits")) db.createObjectStore("deposits", {keyPath:"id"});
      if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta", {keyPath:"id"});
    };
    req.onsuccess = (e)=> resolve(e.target.result);
    req.onerror = (e)=> reject(e.target.error);
  });
  return dbPromise;
}

function tx(storeName, mode){
  return openDB().then(db => db.transaction(storeName, mode).objectStore(storeName));
}
function idbGetAll(storeName){
  return tx(storeName, "readonly").then(store => new Promise((res, rej)=>{
    const r = store.getAll();
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  }));
}
function idbGet(storeName, id){
  return tx(storeName, "readonly").then(store => new Promise((res, rej)=>{
    const r = store.get(id);
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  }));
}
function idbPut(storeName, value){
  return tx(storeName, "readwrite").then(store => new Promise((res, rej)=>{
    const r = store.put(value);
    r.onsuccess = ()=> res(value);
    r.onerror = ()=> rej(r.error);
  }));
}
function idbDelete(storeName, id){
  return tx(storeName, "readwrite").then(store => new Promise((res, rej)=>{
    const r = store.delete(id);
    r.onsuccess = ()=> res(true);
    r.onerror = ()=> rej(r.error);
  }));
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function nowLocalDateTime(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}T${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}:${String(d.getSeconds()).padStart(2,"0")}`;
}

/* ---------- Default settings ---------- */
const DEFAULT_SETTINGS = {
  id: "settings",
  weekStartDay: 2, // Tuesday
  weekEndDay: 6,   // Saturday
  paymentMethods: ["Cash","Card","Venmo","Other"],
  accentColor: "#D6A756",
  font: "system",
  navStyle: "both",
  lastBackupAt: null
};

/* ---------- App state ---------- */
const state = {
  tab: "today",
  customers: [],
  entries: [],
  deposits: [],
  settings: null,
  todayOffset: 0,       // days back from real today, for day navigation
  pinnedDate: null,     // ISO date string (yyyy-mm-dd) when backdating a batch of entries
  customerSearch: "",
  depositSearch: "",
  analyticsYear: null,
  profileCustomerId: null,
  paymentsMonth: null,       // Date, first of month being viewed
  paymentsSelectedDate: null // ISO date string or null (show all)
};

/* ---------- Date helpers ---------- */
const DAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_ABBR = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function todayDateObj(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(date, n){ const d = new Date(date); d.setDate(d.getDate()+n); return d; }
function toISODate(d){ // yyyy-mm-dd local
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function fmtDateShort(d){ return `${MONTH_ABBR[d.getMonth()]} ${d.getDate()}`; }
function fmtDateFull(d){ return `${DAY_NAMES[d.getDay()].slice(0,3)}, ${MONTH_ABBR[d.getMonth()]} ${d.getDate()}`; }
function fmtTime(d){
  let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,"0");
  const ap = h >= 12 ? "PM" : "AM"; h = h % 12; if(h===0) h = 12;
  return `${h}:${m} ${ap}`;
}
function fmtMoney(n){ n = Math.round((n||0)*100)/100; return "$" + n.toLocaleString(undefined,{minimumFractionDigits: n%1?2:0, maximumFractionDigits:2}); }
function currentViewDate(){ return addDays(todayDateObj(), -state.todayOffset); }

function isSameDay(iso, dateObj){ return iso === toISODate(dateObj); }

function weekRangeFor(dateObj){
  const startDay = state.settings.weekStartDay, endDay = state.settings.weekEndDay;
  // length of the working week window
  let span = endDay - startDay; if(span < 0) span += 7; span += 1;
  // find most recent occurrence of startDay on/before dateObj
  let diffToStart = dateObj.getDay() - startDay; if(diffToStart < 0) diffToStart += 7;
  const start = addDays(dateObj, -diffToStart);
  const end = addDays(start, span - 1);
  return {start, end};
}

/* ---------- Load / bootstrap ---------- */
async function loadAll(){
  let settings = await idbGet("meta", "settings");
  if(!settings){ settings = {...DEFAULT_SETTINGS}; await idbPut("meta", settings); }
  state.settings = settings;
  state.customers = await idbGetAll("customers");
  state.entries = await idbGetAll("entries");
  state.deposits = await idbGetAll("deposits");
  const needsBackfill = state.deposits.filter(d => !d.createdAt);
  if(needsBackfill.length){
    for(const d of needsBackfill){
      const parsed = new Date(d.dateTime).getTime();
      d.createdAt = isNaN(parsed) ? Date.now() : parsed;
      await idbPut("deposits", d);
    }
  }
  state.analyticsYear = new Date().getFullYear();
  state.paymentsMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  applyTheme();
}
const LEGACY_ACCENT_MAP = { gold:"#D6A756", blue:"#5B8DEF", teal:"#4FB0A5", red:"#C1392B" };
function accentTextFor(hex){
  const h = hex.replace("#","");
  const r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance > 0.6 ? "#1A1508" : "#FBEAEA";
}
function applyTheme(){
  let accent = state.settings.accentColor;
  if(!accent || !accent.startsWith("#")) accent = LEGACY_ACCENT_MAP[accent] || "#D6A756";
  document.documentElement.style.setProperty("--accent", accent);
  document.documentElement.style.setProperty("--accent-text", accentTextFor(accent));
  document.documentElement.setAttribute("data-font", state.settings.font);
  const nav = document.getElementById("bottom-nav");
  const style = state.settings.navStyle || "both";
  nav.className = "bottom-nav" + (style==="icons" ? " style-icons" : style==="text" ? " style-text" : "");
}
async function saveSettings(){ await idbPut("meta", state.settings); applyTheme(); }

/* ---------- Derived data helpers ---------- */
function getCustomer(id){ return state.customers.find(c => c.id === id); }
function customerEntries(id){ return state.entries.filter(e => e.customerId === id).sort((a,b)=> b.dateTime.localeCompare(a.dateTime)); }
function customerDeposits(id){ return state.deposits.filter(d => d.customerId === id).sort((a,b)=> (b.createdAt||0) - (a.createdAt||0)); }

function depositBalance(customerId){
  let bal = 0;
  for(const d of state.deposits){
    if(d.customerId !== customerId) continue;
    if(d.type === "taken") bal += d.amount;
    else if(d.type === "applied") bal -= d.amount;
    else if(d.type === "refunded") bal -= d.amount;
    else if(d.type === "no_show" && d.resolution === "kept") bal -= d.amount;
  }
  return Math.max(0, Math.round(bal*100)/100);
}
function totalDepositsHeld(){
  return state.customers.reduce((sum,c)=> sum + depositBalance(c.id), 0);
}
function noShowStats(customerId){
  const list = state.deposits.filter(d => d.customerId===customerId && d.type==="no_show");
  return { count: list.length, kept: list.filter(d=>d.resolution==="kept").length, waived: list.filter(d=>d.resolution==="waived").length };
}
function entryTotal(e){ return (e.price||0) + (e.tip||0); }
const PALETTE = ["#D6A756","#5B8DEF","#4FB0A5","#C1392B","#B77FD1","#8B8D93","#7FD17F","#D17FB0"];
function methodColor(name){
  let idx = state.settings.paymentMethods.indexOf(name);
  if(idx === -1){ idx = 0; for(let i=0;i<name.length;i++) idx += name.charCodeAt(i); }
  return PALETTE[idx % PALETTE.length];
}
function sumEntries(list){ return list.reduce((s,e)=> s + entryTotal(e), 0); }
function sumTips(list){ return list.reduce((s,e)=> s + (e.tip||0), 0); }
function tipSubline(list){ const t = sumTips(list); return t>0 ? `<div style="color:var(--text-secondary);font-size:10px;margin-top:2px;">${fmtMoney(t)} tip</div>` : ""; }

function entriesInRange(start, end){ // inclusive, dateObj
  const s = toISODate(start), en = toISODate(end);
  return state.entries.filter(e => { const d = e.dateTime.slice(0,10); return d >= s && d <= en; });
}
function entriesOnDay(dateObj){ const iso = toISODate(dateObj); return state.entries.filter(e => e.dateTime.slice(0,10) === iso).sort((a,b)=> b.dateTime.localeCompare(a.dateTime)); }

function initials(name){
  return name.trim().split(/\s+/).slice(0,2).map(p=>p[0]?.toUpperCase()||"").join("") || "?";
}

/* ---------- Rendering root ---------- */
function render(){
  const el = document.getElementById("screen");
  document.querySelectorAll(".nav-btn").forEach(b=> b.classList.toggle("active", b.dataset.tab === state.tab));
  if(state.tab === "today") el.innerHTML = renderToday();
  else if(state.tab === "customers") el.innerHTML = renderCustomers();
  else if(state.tab === "profile") el.innerHTML = renderProfile();
  else if(state.tab === "deposits") el.innerHTML = renderDeposits();
  else if(state.tab === "payments") el.innerHTML = renderPayments();
  else if(state.tab === "analytics") el.innerHTML = renderAnalytics();
  else if(state.tab === "settings") el.innerHTML = renderSettings();
  bindScreenEvents();
}

function switchTab(tab, extra){
  state.tab = tab;
  if(extra) Object.assign(state, extra);
  render();
}

/* ---------- TODAY screen ---------- */
function renderToday(){
  const viewDate = currentViewDate();
  const isToday = state.todayOffset === 0;
  const dayEntries = entriesOnDay(viewDate);
  const dayTotal = sumEntries(dayEntries);
  const {start, end} = weekRangeFor(viewDate);
  const weekTotal = sumEntries(entriesInRange(start, end));

  // other days this week (before viewDate) that have entries, most recent first
  const otherDays = [];
  for(let d = new Date(start); d <= end; d = addDays(d,1)){
    if(toISODate(d) === toISODate(viewDate)) continue;
    if(d > viewDate) continue;
    const ents = entriesOnDay(d);
    if(ents.length) otherDays.push({date: new Date(d), entries: ents});
  }
  otherDays.sort((a,b)=> b.date - a.date);

  let backdateBanner = "";
  if(state.pinnedDate){
    const pd = new Date(state.pinnedDate + "T00:00:00");
    backdateBanner = `<div class="banner"><span class="txt">Logging for ${fmtDateShort(pd).toUpperCase()}</span>
      <span style="color:var(--text-secondary);font-size:11px;cursor:pointer;" data-action="clear-pin">Reset to today</span></div>`;
  }

  let backupBanner = "";
  if(state.entries.length > 0){
    const lb = state.settings.lastBackupAt ? new Date(state.settings.lastBackupAt) : null;
    const daysSince = lb ? Math.floor((Date.now()-lb.getTime())/86400000) : null;
    if(daysSince === null || daysSince > 14){
      backupBanner = `<div class="banner" style="background:color-mix(in srgb, var(--danger) 16%, var(--surface));" data-action="goto-backup">
        <span class="txt" style="color:var(--danger);">${daysSince===null? "Never backed up" : daysSince + " days since backup"}</span>
        <span style="color:var(--text-secondary);font-size:11px;">Tap to export</span></div>`;
    }
  }

  const rows = dayEntries.length ? dayEntries.map(e => entryRow(e)).join("") :
    `<div class="empty"><i class="ti ti-flame"></i>No payments ${isToday? "yet today":"for this day"}. Log your first one.</div>`;

  const otherDaysHtml = otherDays.map(g => {
    const dow = DAY_NAMES[g.date.getDay()].slice(0,3).toUpperCase();
    return `<div class="eyebrow">${dow} &middot; ${fmtDateShort(g.date)}</div>
      <div class="card" style="padding:4px 16px;">${g.entries.map(e=>entryRow(e)).join("")}</div>`;
  }).join("");

  return `
    <div class="header">
      <i class="ti ti-chevron-left header-icon" data-action="day-back"></i>
      <div class="header-title">${isToday ? "Today" : fmtDateShort(viewDate)}</div>
      <i class="ti ti-chevron-right header-icon right ${isToday?'disabled':''}" data-action="day-fwd"></i>
    </div>
    <div class="sub-date">${fmtDateFull(viewDate)}</div>
    ${backdateBanner}
    ${backupBanner}
    <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-bottom:16px;">
      <div class="stat-box"><div class="lbl">${isToday?"Today":"This day"}</div><div class="val">${fmtMoney(dayTotal)}</div>${tipSubline(dayEntries)}</div>
      <div class="stat-box"><div class="lbl">This week</div><div class="val">${fmtMoney(weekTotal)}</div>${tipSubline(entriesInRange(start,end))}</div>
    </div>
    <div class="eyebrow">${isToday ? "Today" : "This day"}</div>
    <div class="card" style="padding:4px 16px;">${rows}</div>
    ${otherDaysHtml}
    <div style="height:90px;"></div>
    <div class="fixed-cta">
      <button class="btn btn-primary btn-big" data-action="new-entry"><i class="ti ti-plus"></i>New payment</button>
    </div>
  `;
}

function entryRow(e){
  const c = getCustomer(e.customerId);
  const dt = new Date(e.dateTime);
  const depositBadge = e.depositAppliedAmount>0 ? `<div style="font-size:16px;font-weight:800;font-style:italic;color:var(--accent);margin-left:6px;flex-shrink:0;">D</div>` : `<div style="width:11px;flex-shrink:0;"></div>`;
  const editedNote = e.editHistory && e.editHistory.length ? ` · <span style="color:var(--accent);cursor:pointer;" data-action="edit-history" data-id="${e.id}">edited</span>` : "";
  const tipNote = e.tip>0 ? `<div style="color:var(--text-secondary);font-size:10px;margin-top:1px;">${fmtMoney(e.tip)} tip</div>` : "";
  return `<div class="list-row">
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:10px;" data-action="open-entry" data-id="${e.id}">
      <div class="avatar">${initials(c ? c.name : "?")}</div>
      <div style="flex:1;min-width:0;">
        <div class="name">${escapeHtml(c ? c.name : "Unknown")}</div>
        <div class="meta">${fmtTime(dt)}${e.description? " · " + escapeHtml(e.description) : ""}${editedNote}</div>
      </div>
      <div style="text-align:right;">
        <div class="amount">${fmtMoney(entryTotal(e))}</div>${tipNote}
      </div>
    </div>${depositBadge}
  </div>`;
}

function escapeHtml(s){ const d = document.createElement("div"); d.textContent = s==null?"":String(s); return d.innerHTML; }

/* ---------- PAYMENTS screen (calendar + running list) ---------- */
function renderPayments(){
  const month = state.paymentsMonth;
  const y = month.getFullYear(), m = month.getMonth();
  const monthLabel = `${MONTH_ABBR[m]} ${y}`;
  const monthEntries = state.entries.filter(e => { const d=e.dateTime.slice(0,7); return d === `${y}-${String(m+1).padStart(2,"0")}`; });
  const monthTotal = sumEntries(monthEntries);

  // group month entries by day -> list of payment methods, one per payment
  const dayPayments = {}; // iso -> array of method names, one entry per payment
  monthEntries.forEach(e=>{
    const iso = e.dateTime.slice(0,10);
    if(!dayPayments[iso]) dayPayments[iso] = [];
    dayPayments[iso].push(e.paymentMethod);
  });

  const startDow = 0; // calendar is always Sun-Sat, independent of the work-week setting
  const firstOfMonth = new Date(y, m, 1);
  const firstDow = firstOfMonth.getDay();
  let leadBlank = firstDow - startDow; if(leadBlank < 0) leadBlank += 7;
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const todayIso = toISODate(todayDateObj());

  const dowLabels = ["S","M","T","W","T","F","S"];
  const DOT_CAP = 6;

  let cells = "";
  for(let i=0;i<leadBlank;i++) cells += `<div></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const payments = dayPayments[iso];
    const isSelected = state.paymentsSelectedDate === iso;
    const isToday = iso === todayIso;
    let dots = `<div class="cal-dots"></div>`;
    if(payments){
      const shown = payments.slice(0, DOT_CAP).map(name=>`<div class="cal-dot" style="background:${methodColor(name)};"></div>`).join("");
      const overflow = payments.length > DOT_CAP ? `<div style="font-size:6.5px;color:inherit;opacity:0.7;line-height:1;">+${payments.length-DOT_CAP}</div>` : "";
      dots = `<div class="cal-dots">${shown}</div>${overflow}`;
    }
    cells += `<div class="cal-day ${isSelected?'selected':''} ${isToday && !isSelected?'is-today':''}" data-action="pick-day" data-date="${iso}">
      <span>${d}</span>${dots}
    </div>`;
  }

  let listTitle, listEntries;
  if(state.paymentsSelectedDate){
    const sd = new Date(state.paymentsSelectedDate + "T00:00:00");
    listTitle = fmtDateFull(sd);
    listEntries = state.entries.filter(e => e.dateTime.slice(0,10) === state.paymentsSelectedDate);
  } else {
    listTitle = "All payments";
    listEntries = [...state.entries];
  }
  listEntries.sort((a,b)=> b.dateTime.localeCompare(a.dateTime));

  let rows;
  if(!listEntries.length){
    rows = `<div class="empty" style="padding:20px 0;">No payments here.</div>`;
  } else if(state.paymentsSelectedDate){
    rows = listEntries.map(e => entryRow(e)).join("");
  } else {
    // group by date with separators when showing the full running list
    let lastDate = null;
    rows = listEntries.map(e => {
      const iso = e.dateTime.slice(0,10);
      let sep = "";
      if(iso !== lastDate){
        lastDate = iso;
        const d = new Date(iso + "T00:00:00");
        const dow = DAY_NAMES[d.getDay()].slice(0,3).toUpperCase();
        sep = `<div style="padding:${e===listEntries[0]?'2px':'12px'} 0 6px;color:var(--text-secondary);font-size:10px;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;">${dow} &middot; ${fmtDateShort(d)}</div>`;
      }
      return sep + entryRow(e);
    }).join("");
  }

  const legend = state.settings.paymentMethods.map(name => `<div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-secondary);"><div class="cal-dot" style="background:${methodColor(name)};"></div>${escapeHtml(name)}</div>`).join("");

  return `
    <div class="header"><div></div><div class="header-title">Payments</div><div></div></div>
    <div style="height:14px;"></div>

    <div class="card">
      <div class="header" style="grid-template-columns:24px 1fr 24px;margin-bottom:2px;">
        <i class="ti ti-chevron-left header-icon" data-action="payments-month-back"></i>
        <div style="text-align:center;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">${monthLabel}</div>
        <i class="ti ti-chevron-right header-icon right" data-action="payments-month-fwd"></i>
      </div>
      <div style="text-align:center;color:var(--text-secondary);font-size:11px;margin-bottom:10px;">${fmtMoney(monthTotal)} this month${sumTips(monthEntries)>0 ? ` (${fmtMoney(sumTips(monthEntries))} tip)` : ""}</div>
      <div class="cal-grid cal-dow">${dowLabels.map(l=>`<div>${l}</div>`).join("")}</div>
      <div class="cal-grid">${cells}</div>
      <div class="row" style="gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);">${legend}</div>
    </div>

    <div class="row-between" style="margin-bottom:6px;">
      <div class="eyebrow" style="margin:0;">${listTitle}</div>
      ${state.paymentsSelectedDate ? `<span style="color:var(--accent);font-size:11px;cursor:pointer;" data-action="clear-day-filter">Show all</span>` : ""}
    </div>
    <div class="card" style="padding:4px 16px;max-height:360px;overflow-y:auto;">${rows}</div>
  `;
}


/* ---------- ANALYTICS screen ---------- */
function renderAnalytics(){
  const now = todayDateObj();
  const yStart = new Date(now.getFullYear(),0,1), yEnd = new Date(now.getFullYear(),11,31);
  const mStart = new Date(now.getFullYear(), now.getMonth(), 1), mEnd = new Date(now.getFullYear(), now.getMonth()+1, 0);
  const {start:wStart, end:wEnd} = weekRangeFor(now);

  const todayEntries = entriesOnDay(now);
  const weekEntries = entriesInRange(wStart, wEnd);
  const monthEntries = entriesInRange(mStart, mEnd);

  const year = state.analyticsYear;
  const yearEntries = state.entries.filter(e => e.dateTime.slice(0,4) === String(year));
  const yearTotal = sumEntries(yearEntries);
  const allTimeTotal = sumEntries(state.entries);

  const avgPrice = state.entries.length ? sumEntries(state.entries)/state.entries.length : 0;
  const totalTips = state.entries.reduce((s,e)=> s+(e.tip||0),0);
  const avgTip = state.entries.length ? totalTips/state.entries.length : 0;

  // monthly breakdown for selected year
  const monthTotals = new Array(12).fill(0);
  const monthMethodTotals = Array.from({length:12}, ()=>({}));
  yearEntries.forEach(e=>{
    const mi = parseInt(e.dateTime.slice(5,7),10)-1;
    const val = entryTotal(e);
    monthTotals[mi] += val;
    monthMethodTotals[mi][e.paymentMethod] = (monthMethodTotals[mi][e.paymentMethod]||0) + val;
  });
  const maxMonth = Math.max(1, ...monthTotals);
  const bars = monthTotals.map((v,i)=>{
    const barH = Math.max(2, (v/maxMonth)*60);
    let segsHtml;
    if(v > 0){
      const sortedMethods = Object.keys(monthMethodTotals[i]).sort((a,b)=> state.settings.paymentMethods.indexOf(a) - state.settings.paymentMethods.indexOf(b));
      segsHtml = sortedMethods.map(name=>{
        const val = monthMethodTotals[i][name];
        return `<div style="width:100%;background:${methodColor(name)};height:${(val/v)*barH}px;"></div>`;
      }).join("");
    } else {
      segsHtml = `<div style="width:100%;background:var(--surface3);height:${barH}px;"></div>`;
    }
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
      <div style="width:100%;background:var(--surface3);border-radius:3px;height:60px;display:flex;align-items:flex-end;overflow:hidden;">
        <div style="width:100%;display:flex;flex-direction:column-reverse;border-radius:3px;overflow:hidden;">${segsHtml}</div>
      </div>
      <div style="font-size:8px;color:var(--text-muted);">${MONTH_ABBR[i][0]}</div>
    </div>`;
  }).join("");

  // payment method breakdown (all-time)
  const methodTotals = {};
  state.entries.forEach(e => { methodTotals[e.paymentMethod] = (methodTotals[e.paymentMethod]||0) + entryTotal(e); });
  const methodEntries = Object.entries(methodTotals).sort((a,b)=>b[1]-a[1]);
  const methodTotalSum = methodEntries.reduce((s,[,v])=>s+v,0) || 1;
  let cumOffset = 0;
  const circleR = 15.5, circumference = 2*Math.PI*circleR;
  const donutSegs = methodEntries.map(([name,val],i)=>{
    const frac = val/methodTotalSum;
    const dash = frac*circumference;
    const seg = `<circle cx="18" cy="18" r="${circleR}" fill="none" stroke="${methodColor(name)}" stroke-width="5" stroke-dasharray="${dash} ${circumference}" stroke-dashoffset="${-cumOffset}" transform="rotate(-90 18 18)"/>`;
    cumOffset += dash;
    return seg;
  }).join("");
  const legend = methodEntries.map(([name,val])=> `<div style="font-size:11px;color:${methodColor(name)};">&#9679; ${escapeHtml(name)} ${Math.round(val/methodTotalSum*100)}%</div>`).join("");

  // top customers
  const byCustomer = {};
  state.entries.forEach(e => { byCustomer[e.customerId] = (byCustomer[e.customerId]||0) + entryTotal(e); });
  const topCustomers = Object.entries(byCustomer).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(([id,val])=> { const c = getCustomer(id); return `<div class="row-between" style="padding:6px 0;"><span style="font-size:12px;">${escapeHtml(c?c.name:"Unknown")}</span><span style="font-size:12px;font-weight:700;">${fmtMoney(val)}</span></div>`; }).join("");

  const yearOptions = Array.from(new Set(state.entries.map(e=> e.dateTime.slice(0,4)))).map(Number);
  if(!yearOptions.includes(now.getFullYear())) yearOptions.push(now.getFullYear());
  yearOptions.sort((a,b)=>b-a);

  return `
    <div class="header"><div></div><div class="header-title">Stats</div><div></div></div>
    <div style="height:14px;"></div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-bottom:8px;">
      <div class="stat-box"><div class="lbl">Today</div><div class="val">${fmtMoney(sumEntries(todayEntries))}</div>${tipSubline(todayEntries)}</div>
      <div class="stat-box"><div class="lbl">This week</div><div class="val">${fmtMoney(sumEntries(weekEntries))}</div>${tipSubline(weekEntries)}</div>
    </div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-bottom:14px;">
      <div class="stat-box"><div class="lbl">This month</div><div class="val">${fmtMoney(sumEntries(monthEntries))}</div>${tipSubline(monthEntries)}</div>
      <div class="stat-box"><div class="lbl">All time</div><div class="val">${fmtMoney(allTimeTotal)}</div>${tipSubline(state.entries)}</div>
    </div>

    <div class="card">
      <div class="row-between" style="margin-bottom:10px;">
        <div class="eyebrow" style="margin:0;">Monthly total, ${year}</div>
        <select id="year-select" style="width:auto;padding:4px 8px;font-size:16px;">
          ${yearOptions.map(y=> `<option value="${y}" ${y===year?"selected":""}>${y}</option>`).join("")}
        </select>
      </div>
      <div style="font-size:22px;font-weight:800;margin-bottom:2px;">${fmtMoney(yearTotal)}</div>
      ${sumTips(yearEntries)>0 ? `<div style="color:var(--text-secondary);font-size:11px;margin-bottom:8px;">${fmtMoney(sumTips(yearEntries))} tip</div>` : `<div style="margin-bottom:8px;"></div>`}
      <div style="display:flex;gap:4px;align-items:flex-end;">${bars}</div>
    </div>

    <div class="card">
      <div class="eyebrow">Payment method (all time)</div>
      <div class="row" style="gap:14px;">
        <svg width="60" height="60" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--surface3)" stroke-width="5"/>
          ${donutSegs}
        </svg>
        <div>${legend || '<span style="color:var(--text-secondary);font-size:12px;">No data yet</span>'}</div>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Averages</div>
      <div class="row-between" style="padding:4px 0;"><span style="font-size:12px;color:var(--text-secondary);">Avg. per tattoo</span><span style="font-size:12px;font-weight:700;">${fmtMoney(avgPrice)}</span></div>
      <div class="row-between" style="padding:4px 0;"><span style="font-size:12px;color:var(--text-secondary);">Avg. tip</span><span style="font-size:12px;font-weight:700;">${fmtMoney(avgTip)}</span></div>
      <div class="row-between" style="padding:4px 0;"><span style="font-size:12px;color:var(--text-secondary);">Total tattoos logged</span><span style="font-size:12px;font-weight:700;">${state.entries.length}</span></div>
    </div>

    ${topCustomers ? `<div class="card"><div class="eyebrow">Top customers</div>${topCustomers}</div>` : ""}
  `;
}

  const daysSince = lastBackup ? Math.floor((Date.now()-lastBackup.getTime())/86400000) : null;

  const methodChips = s.paymentMethods.map(m => `<div class="stat-box" style="display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 4px;cursor:pointer;" data-action="edit-method" data-name="${escapeHtml(m)}">
      <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;">${escapeHtml(m)}</span>
    </div>`).join("");

  const isCustom = !presetHexes.some(h=>h.toLowerCase()===currentAccentHex.toLowerCase());

  const fontOptions = [["system","System sans"],["helvetica","Helvetica"],["verdana","Verdana"]]
    .map(([key,label]) => `<div class="chip ${s.font===key?'active':''}" data-action="set-font" data-val="${key}">${label}</div>`).join("");

  return `
    <div class="header"><div></div><div class="header-title">Settings</div><div></div></div>
    <div style="height:14px;"></div>

    <div class="card">
      <div class="eyebrow">Week range</div>
      <div class="row" style="gap:8px;">
        <select id="week-start" style="flex:1;">${DAY_NAMES.map((d,i)=> `<option value="${i}" ${i===s.weekStartDay?"selected":""}>${d}</option>`).join("")}</select>
        <i class="ti ti-arrow-right" style="color:var(--text-secondary);"></i>
        <select id="week-end" style="flex:1;">${DAY_NAMES.map((d,i)=> `<option value="${i}" ${i===s.weekEndDay?"selected":""}>${d}</option>`).join("")}</select>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">Payment methods</div>
      <div class="grid-4" style="margin-bottom:10px;">${methodChips}</div>
      <button class="btn btn-ghost" data-action="add-method"><i class="ti ti-plus"></i>Add method</button>
    </div>

    <div class="card">
      <div class="eyebrow">Accent color</div>
      <div class="row" style="gap:10px;margin-bottom:16px;align-items:center;">
        ${accentSwatches}
        <div style="position:relative;width:22px;height:22px;">
          <input type="color" id="custom-accent" value="${currentAccentHex}" style="position:absolute;inset:0;width:22px;height:22px;padding:0;border:${isCustom?'2px solid var(--text)':'1px dashed var(--text-secondary)'};border-radius:50%;cursor:pointer;background:none;-webkit-appearance:none;">
          ${!isCustom ? `<i class="ti ti-palette" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;color:var(--text-secondary);pointer-events:none;"></i>` : ""}
        </div>
      </div>
      <div class="eyebrow">Font</div>
      <div class="chip-row" style="margin-bottom:0;">${fontOptions}</div>
    </div>

    <div class="card">
      <div class="eyebrow">Bottom tabs</div>
      <div class="chip-row" style="margin-bottom:0;">${navOptions}</div>
    </div>

    <div class="card">
      <div class="eyebrow">Backup</div>
      <div style="font-size:12px;margin-bottom:2px;">${lastBackup ? "Last backup: " + timeAgo(lastBackup) : "No backup yet"}</div>
      ${backupWarn ? `<div style="color:#E2A23B;font-size:11px;margin-bottom:10px;">Export a backup soon</div>` : `<div style="height:10px;"></div>`}
      <div class="row" style="gap:8px;">
        <button class="btn btn-secondary" data-action="export-json"><i class="ti ti-download"></i>Export Backup</button>
        <button class="btn btn-secondary" data-action="export-csv"><i class="ti ti-file-spreadsheet"></i>Export CSV</button>
      </div>
      <div style="height:8px;"></div>
      <button class="btn btn-ghost" data-action="import-json"><i class="ti ti-upload"></i>Import backup</button>
      <input type="file" id="import-file" accept="application/json" style="display:none;">

    <div class="card">
      <div class="eyebrow" style="color:var(--danger);">Danger zone</div>
      <button class="btn btn-danger" data-action="clear-data"><i class="ti ti-trash"></i>Erase all data</button>
    </div>
  `;
}

function timeAgo(date){
  const days = Math.floor((Date.now()-date.getTime())/86400000);
  if(days<=0) return "today";
  if(days===1) return "1 day ago";
  return days + " days ago";
}

/* ---------- Toast ---------- */
function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 2200);
}

/* ---------- Modal helpers ---------- */
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }
function openModal(html, opts){
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay" + (opts && opts.center ? " center" : "");
  overlay.innerHTML = html;
  overlay.addEventListener("click", (e)=>{ if(e.target === overlay) closeModal(); });
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  root.appendChild(overlay);
  return overlay;
}

/* ---------- Entry form (new / edit) ---------- */
function recentCustomerIds(limit){
  const seen = new Set(); const out = [];
  const sorted = [...state.entries].sort((a,b)=> b.dateTime.localeCompare(a.dateTime));
  for(const e of sorted){ if(!seen.has(e.customerId)){ seen.add(e.customerId); out.push(e.customerId); } if(out.length>=limit) break; }
  return out;
}

function defaultEntryDate(){
  if(state.pinnedDate) return state.pinnedDate;
  return toISODate(currentViewDate());
}

function openEntryForm(existingId){
  const editing = existingId ? state.entries.find(e=>e.id===existingId) : null;
  const cust = editing ? getCustomer(editing.customerId) : null;
  const form = {
    id: editing ? editing.id : null,
    customerId: editing ? editing.customerId : null,
    customerName: editing ? (cust ? cust.name : "") : "",
    date: editing ? editing.dateTime.slice(0,10) : defaultEntryDate(),
    time: editing ? editing.dateTime.slice(11,16) : fmtTime24(new Date()),
    price: editing ? editing.price : "",
    tip: editing ? editing.tip : "",
    paymentMethod: editing ? editing.paymentMethod : state.settings.paymentMethods[0],
    description: editing ? (editing.description||"") : "",
    depositApplied: editing ? !!editing.depositAppliedAmount : false,
    depositAmount: editing ? (editing.depositAppliedAmount||"") : ""
  };

  const recentChips = recentCustomerIds(3).map(id=>{
    const c = getCustomer(id); if(!c) return "";
    return `<div class="chip" data-recent-cust="${c.id}">${escapeHtml(c.name)}</div>`;
  }).join("");

  const html = `<div class="sheet" id="entry-sheet">
    <div class="header" style="margin-bottom:12px;">
      <div></div>
      <div class="header-title">${editing? "Edit payment" : "New payment"}</div>
      <i class="ti ti-x header-icon right" data-action="close-modal"></i>
    </div>

    ${!editing ? `<div class="eyebrow">Logging for</div>
    <div class="date-row">
      <input type="date" id="f-date" class="date-chip-input" value="${form.date}">
      <input type="time" id="f-time" class="date-chip-input" value="${form.time}">
    </div>` : `<div class="date-row">
      <input type="date" id="f-date" class="date-chip-input" value="${form.date}">
      <input type="time" id="f-time" class="date-chip-input" value="${form.time}">
    </div>`}

    <div class="field">
      <div class="eyebrow">Customer</div>
      <div class="search-box" style="margin-bottom:6px;">
        <i class="ti ti-search" style="color:var(--text-secondary);font-size:15px;"></i>
        <input id="f-customer" placeholder="Search or type a new name" value="${escapeHtml(form.customerName)}" autocomplete="off">
      </div>
      <div id="cust-suggestions"></div>
      ${recentChips ? `<div class="chip-row" style="margin-top:6px;margin-bottom:0;">${recentChips}<div class="chip" data-action="new-customer-chip">+ New</div></div>` : ""}
    </div>

    <div class="row" style="gap:10px;">
      <div class="field" style="flex:1;">
        <div class="eyebrow">Price</div>
        <input id="f-price" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="${form.price}">
      </div>
      <div class="field" style="flex:1;">
        <div class="eyebrow">Tip</div>
        <input id="f-tip" type="number" inputmode="decimal" min="0" step="1" placeholder="0" value="${form.tip}">
      </div>
    </div>

    <div class="field">
      <div class="eyebrow">Payment method</div>
      <select id="f-payment">${state.settings.paymentMethods.map(m=> `<option value="${escapeHtml(m)}" ${m===form.paymentMethod?"selected":""}>${escapeHtml(m)}</option>`).join("")}</select>
    </div>

    <div id="deposit-block"></div>

    <div class="field">
      <div class="eyebrow">Description</div>
      <input id="f-description" placeholder="e.g. Small script, forearm" value="${escapeHtml(form.description)}">
    </div>

    <div id="f-error" class="err" style="display:none;"></div>

    <button class="btn btn-primary" data-action="save-entry" style="margin-bottom:10px;">Save payment</button>
    ${editing ? `<button class="btn btn-danger" data-action="delete-entry" data-id="${editing.id}">Delete payment</button>` :
      `<div id="save-another-wrap"></div>`}
  </div>`;

  const overlay = openModal(html);
  overlay._form = form;
  refreshCustomerField(overlay);
  refreshDepositBlock(overlay);
  refreshSaveAnother(overlay);
  bindEntryFormEvents(overlay, editing);
}

function fmtTime24(d){ return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }

function refreshCustomerField(overlay){
  const input = overlay.querySelector("#f-customer");
  const box = overlay.querySelector("#cust-suggestions");
  const q = input.value.trim().toLowerCase();
  if(!q){ box.innerHTML = ""; overlay._form.customerId = null; overlay._form.customerName = ""; return; }
  const matches = state.customers.filter(c => c.name.toLowerCase().includes(q)).slice(0,5);
  const exact = state.customers.find(c => c.name.toLowerCase() === q);
  overlay._form.customerId = exact ? exact.id : null;
  overlay._form.customerName = input.value.trim();
  if(matches.length){
    box.innerHTML = `<div class="card" style="padding:4px 10px;margin-bottom:0;">${matches.map(c=>
      `<div class="list-row" style="padding:8px 0;cursor:pointer;" data-pick-cust="${c.id}"><div class="avatar" style="width:24px;height:24px;font-size:10px;">${initials(c.name)}</div><div class="name" style="font-size:13px;">${escapeHtml(c.name)}</div></div>`
    ).join("")}</div>`;
  } else { box.innerHTML = ""; }
  refreshDepositBlock(overlay);
}

function refreshDepositBlock(overlay){
  const block = overlay.querySelector("#deposit-block");
  const form = overlay._form;
  const bal = form.customerId ? depositBalance(form.customerId) : 0;

  // Editing an existing entry that used a deposit: always show that fact,
  // regardless of the customer's current remaining balance (which may since be $0).
  if(form.id && form.depositAmount > 0){
    block.innerHTML = `
      <div class="field">
        <div class="row" style="gap:8px;">
          <i class="ti ti-wallet" style="font-size:15px;color:var(--accent);flex-shrink:0;"></i>
          <span style="font-size:12px;color:var(--text);">${fmtMoney(form.depositAmount)} from deposit was used on this session</span>
        </div>
      </div>`;
    return;
  }

  if(!form.customerId || bal<=0){ block.innerHTML = ""; form.depositApplied = false; return; }

function doSaveEntry(overlay, editing, addAnother){
  const form = overlay._form;
  const errBox = overlay.querySelector("#f-error");
  errBox.style.display = "none";
  const name = overlay.querySelector("#f-customer").value.trim();
  const date = overlay.querySelector("#f-date").value;
  const time = overlay.querySelector("#f-time").value;
  const price = parseFloat(overlay.querySelector("#f-price").value);
  const tip = parseFloat(overlay.querySelector("#f-tip").value) || 0;
  const paymentMethod = overlay.querySelector("#f-payment").value;
  const description = overlay.querySelector("#f-description").value.trim();
  const depositToggle = overlay.querySelector("#f-deposit-toggle");
  const depositApplied = depositToggle ? depositToggle.classList.contains("on") : false;
  const depositAmountInput = overlay.querySelector("#f-deposit-amount");
  const depositAmount = depositAmountInput ? parseFloat(depositAmountInput.value) : 0;

  if(!name){ return showFormError(errBox, "Enter a customer name first."); }
  if(!date || !time){ return showFormError(errBox, "Enter a date and time."); }
  if(isNaN(price) || price < 0){ return showFormError(errBox, "Enter a valid price."); }
  if(depositApplied){
    const bal = form.customerId ? depositBalance(form.customerId) : 0;
    if(isNaN(depositAmount) || depositAmount<=0 || depositAmount>bal){ return showFormError(errBox, "Deposit amount must be between $0 and " + fmtMoney(bal) + "."); }
  }

  let customerId = form.customerId;
  const proceed = () => {
    const dateTime = `${date}T${time}`;
    if(editing){
      const before = {...editing};
      const updated = {...editing, customerId, dateTime, price, tip, paymentMethod, description};
      const changes = [];
      [["customerId","Customer"],["dateTime","Date/time"],["price","Price"],["tip","Tip"],["paymentMethod","Payment method"],["description","Description"]].forEach(([k,label])=>{
        if(String(before[k]) !== String(updated[k])){
          let from = before[k], to = updated[k];
          if(k==="customerId"){ from = getCustomer(from)?.name || from; to = getCustomer(to)?.name || to; }
          if(k==="dateTime"){ from = fmtDateShort(new Date(from))+" "+fmtTime(new Date(from)); to = fmtDateShort(new Date(to))+" "+fmtTime(new Date(to)); }
          if(k==="price" || k==="tip"){ from = fmtMoney(from); to = fmtMoney(to); }
          changes.push({field:label, from, to});
        }
      });
      if(changes.length){
        updated.editHistory = [...(editing.editHistory||[]), {timestamp: Date.now(), changes}];
      }
      idbPut("entries", updated).then(()=>{
        state.entries = state.entries.map(e=> e.id===updated.id ? updated : e);
        closeModal(); render(); toast("Payment updated");
      });
    } else {
      const entry = { id: uid(), customerId, dateTime, price, tip, paymentMethod, description, depositAppliedAmount: depositApplied?depositAmount:0, editHistory: [] };
      idbPut("entries", entry).then(()=>{
        state.entries.push(entry);
        if(depositApplied && depositAmount>0){
          const ledger = { id: uid(), customerId, type:"applied", amount: depositAmount, dateTime, createdAt: Date.now(), note:"Applied to session", appliedToEntryId: entry.id };
          idbPut("deposits", ledger).then(()=>{ state.deposits.push(ledger); finishSave(); });
        } else finishSave();
      });
    }
    function finishSave(){
      if(date === toISODate(todayDateObj())) state.pinnedDate = null;
      if(addAnother){
        closeModal(); render(); openEntryForm(); toast("Payment saved");
      } else { closeModal(); render(); toast("Payment saved"); }
    }
  };

  if(!customerId){
    const existing = state.customers.find(c=> c.name.toLowerCase()===name.toLowerCase());
    if(existing){ customerId = existing.id; proceed(); }
    else {
      const c = { id: uid(), name, createdAt: Date.now() };
      idbPut("customers", c).then(()=>{ state.customers.push(c); customerId = c.id; proceed(); });
    }
  } else proceed();
}

/* ---------- Backup: export / import ---------- */
function downloadBlob(content, filename, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}

function exportJSON(message){
  const payload = { version:1, exportedAt: new Date().toISOString(), customers: state.customers, entries: state.entries, deposits: state.deposits, settings: state.settings };
  downloadBlob(JSON.stringify(payload, null, 2), `ledg-backup-${toISODate(new Date())}.json`, "application/json");
  state.settings.lastBackupAt = Date.now();
  saveSettings(); render(); toast(message || "Backup exported");
}

function exportCSV(){
  const header = ["Date","Time","Customer","Description","Price","Tip","Payment method","Deposit applied"];
  const rows = [...state.entries].sort((a,b)=> a.dateTime.localeCompare(b.dateTime)).map(e=>{
    const c = getCustomer(e.customerId);
    const d = new Date(e.dateTime);
    return [toISODate(d), fmtTime(d), c?c.name:"", e.description||"", e.price, e.tip, e.paymentMethod, e.depositAppliedAmount||0]
      .map(v => `"${String(v).replace(/"/g,'""')}"`).join(",");
  });
  downloadBlob([header.join(","), ...rows].join("\n"), `ledg-entries-${toISODate(new Date())}.csv`, "text/csv");
  toast("CSV exported");
}

function importJSON(file){
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try{ data = JSON.parse(reader.result); } catch(e){ toast("That file isn't valid JSON."); return; }
    if(!data || !Array.isArray(data.entries) || !Array.isArray(data.customers)){ toast("That doesn't look like a backup file."); return; }
    confirmDialog("Import backup?", "This replaces all current data with the backup file's contents.", async ()=>{
      const stores = ["customers","entries","deposits"];
      for(const s of stores){
        const all = await idbGetAll(s);
        for(const item of all) await idbDelete(s, item.id);
      }
      for(const c of data.customers) await idbPut("customers", c);
      for(const e of data.entries) await idbPut("entries", e);
      for(const d of (data.deposits||[])) await idbPut("deposits", d);
      if(data.settings) await idbPut("meta", {...DEFAULT_SETTINGS, ...data.settings, id:"settings"});
      await loadAll();
      state.tab = "today"; state.todayOffset = 0; state.pinnedDate = null;
      render(); toast("Backup imported");
    });
  };
  reader.readAsText(file);
}

  const el = document.getElementById("screen");

  const searchInput = document.getElementById("customer-search");
  if(searchInput) searchInput.addEventListener("input", (e)=>{ state.customerSearch = e.target.value; render(); preserveFocus("customer-search"); });

  const depSearchInput = document.getElementById("deposit-search");
  if(depSearchInput) depSearchInput.addEventListener("input", (e)=>{ state.depositSearch = e.target.value; render(); preserveFocus("deposit-search"); });

  const yearSelect = document.getElementById("year-select");
  if(yearSelect) yearSelect.addEventListener("change", (e)=>{ state.analyticsYear = parseInt(e.target.value,10); render(); });

  const weekStart = document.getElementById("week-start");
  if(weekStart) weekStart.addEventListener("change", (e)=>{ state.settings.weekStartDay = parseInt(e.target.value,10); saveSettings(); });
  const weekEnd = document.getElementById("week-end");
  if(weekEnd) weekEnd.addEventListener("change", (e)=>{ state.settings.weekEndDay = parseInt(e.target.value,10); saveSettings(); });

  const importFile = document.getElementById("import-file");
  if(importFile) importFile.addEventListener("change", (e)=>{ if(e.target.files[0]) importJSON(e.target.files[0]); });

  const customAccent = document.getElementById("custom-accent");
  if(customAccent) customAccent.addEventListener("input", (e)=>{ state.settings.accentColor = e.target.value; saveSettings().then(render); });

  el.onclick = (e)=>{
    const t = (sel)=> e.target.closest(sel);
    if(t("[data-action='new-entry']")) return openEntryForm();
    if(t("[data-action='open-entry']")) return openEntryForm(t("[data-action='open-entry']").dataset.id);
    if(t("[data-action='edit-history']")) return openEditHistory(t("[data-action='edit-history']").dataset.id);
    if(t("[data-action='day-back']")){ state.todayOffset++; return render(); }
    if(t("[data-action='day-fwd']")){ if(state.todayOffset>0){ state.todayOffset--; render(); } return; }
    if(t("[data-action='clear-pin']")){ state.pinnedDate=null; return render(); }
    if(t("[data-action='goto-backup']")){ state.tab = "settings"; return render(); }
    if(t("[data-action='payments-month-back']")){ state.paymentsMonth = new Date(state.paymentsMonth.getFullYear(), state.paymentsMonth.getMonth()-1, 1); return render(); }
    if(t("[data-action='payments-month-fwd']")){ state.paymentsMonth = new Date(state.paymentsMonth.getFullYear(), state.paymentsMonth.getMonth()+1, 1); return render(); }
    if(t("[data-action='pick-day']")){
      const date = t("[data-action='pick-day']").dataset.date;
      state.paymentsSelectedDate = (state.paymentsSelectedDate === date) ? null : date;
      return render();
    }
    if(t("[data-action='clear-day-filter']")){ state.paymentsSelectedDate = null; return render(); }
    if(t("[data-action='open-profile']")){ state.profileCustomerId = t("[data-action='open-profile']").dataset.id; state.tab="profile"; return render(); }
    if(t("[data-action='back-to-customers']")){ state.tab="customers"; return render(); }
    if(t("[data-action='delete-customer']")){
      const id = t("[data-action='delete-customer']").dataset.id;
      confirmDialog("Delete customer?", "This removes the customer but keeps their past entries on record.", ()=>{
        idbDelete("customers", id).then(()=>{ state.customers = state.customers.filter(c=>c.id!==id); state.tab="customers"; render(); toast("Customer deleted"); });
      });
      return;
    }
    if(t("[data-action='take-deposit']")) return openTakeDeposit(t("[data-action='take-deposit']").dataset.id);
    if(t("[data-action='deposit-action']")) return openDepositManage(t("[data-action='deposit-action']").dataset.id);
    if(t("[data-action='edit-method']")) return openEditMethodDialog(t("[data-action='edit-method']").dataset.name);
    if(t("[data-action='add-method']")) return openAddMethodDialog();
    if(t("[data-action='set-accent']")){ state.settings.accentColor = t("[data-action='set-accent']").dataset.val; return saveSettings().then(render); }
    if(t("[data-action='set-font']")){ state.settings.font = t("[data-action='set-font']").dataset.val; return saveSettings().then(render); }
    if(t("[data-action='set-nav-style']")){ state.settings.navStyle = t("[data-action='set-nav-style']").dataset.val; return saveSettings().then(render); }
    if(t("[data-action='new-deposit']")) return openNewDeposit();
    if(t("[data-action='export-json']")) return exportJSON();
    if(t("[data-action='export-csv']")) return exportCSV();
    if(t("[data-action='import-json']")) return document.getElementById("import-file").click();
    if(t("[data-action='clear-data']")){
      confirmDialog("Erase all data?", "This deletes every customer, entry, and deposit. This can't be undone — export a backup first if unsure.", async ()=>{
        for(const s of ["customers","entries","deposits"]){
          const all = await idbGetAll(s);
          for(const item of all) await idbDelete(s, item.id);
        }
        await idbPut("meta", {...DEFAULT_SETTINGS});
        await loadAll();
        state.tab="today"; render(); toast("All data erased");
      });
      return;
    }
  };
}

function preserveFocus(id){ const elx = document.getElementById(id); if(elx){ elx.focus(); const v=elx.value; elx.value=""; elx.value=v; } }

/* ---------- Nav & boot ---------- */
document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const tab = btn.dataset.tab;
    if(tab !== "today"){ state.pinnedDate = null; state.todayOffset = 0; }
    state.tab = tab;
    render();
  });
});

/* ---------- Automatic periodic backup ---------- */
let autoBackupChecked = false;
function maybeAutoBackup(){
  if(autoBackupChecked) return;
  autoBackupChecked = true;
  if(!state.settings || !state.entries.length) return;
  const lb = state.settings.lastBackupAt;
  const days = lb ? Math.floor((Date.now()-lb)/86400000) : Infinity;
  if(days >= 14){
    try{ exportJSON("Backed up automatically"); }catch(e){}
  }
}
document.addEventListener("click", maybeAutoBackup, {once:true});

if(navigator.storage && navigator.storage.persist){
  navigator.storage.persist().catch(()=>{});
}

loadAll().then(render).catch(err=>{
  document.getElementById("screen").innerHTML = `<div class="empty"><i class="ti ti-alert-triangle"></i>Couldn't open the local database.<br>${escapeHtml(err.message||String(err))}</div>`;
});

})();
</script>
</body>
</html>
